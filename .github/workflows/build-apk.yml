name: Build & Release Signed Android APK (Hoglabunia Voter App)

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate Auto-Incrementing App Version
        id: version
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          cat <<EOF > public/version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "repo": "${{ github.repository }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/Hoglabunia-Voter-App.apk",
            "releaseNotes": "ভার্সন v${VERSION_NAME} (বিল্ড #${{ github.run_number }}) — হোগলাবুনিয়া ভোটার তালিকা (Material UI 3)।"
          }
          EOF
          cat public/version.json

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Web Dependencies
        run: |
          npm install --no-audit --no-fund
          node node_modules/esbuild/install.js 2>/dev/null || true

      - name: Build Web Production Bundle
        run: npm run build

      - name: Embed Web Assets into Android App
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/ 2>/dev/null || true
          rm -rf android/app/src/main/assets/public/assets/aistudio 2>/dev/null || true
          cp -r villages android/app/src/main/assets/public/ 2>/dev/null || true
          cp public/version.json android/app/src/main/assets/public/version.json 2>/dev/null || true
          echo "Assets bundled successfully:"
          ls -la android/app/src/main/assets/public/

      - name: Verify Deterministic Signing Keystore
        run: |
          if [ ! -s android/app/voter-release-key.p12 ] && [ -f android/app/voter-release-key.base64 ]; then
            base64 -d android/app/voter-release-key.base64 > android/app/voter-release-key.p12
          fi
          rm -f android/app/voter-release-key.jks
          keytool -importkeystore \
            -srckeystore android/app/voter-release-key.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass voter123456 \
            -srckeypass voter123456 \
            -srcalias voterkey \
            -destkeystore android/app/voter-release-key.jks \
            -deststoretype JKS \
            -deststorepass voter123456 \
            -destkeypass voter123456 \
            -destalias voterkey \
            -noprompt || cp android/app/voter-release-key.p12 android/app/voter-release-key.jks
          keytool -list -v -keystore android/app/voter-release-key.jks -storepass voter123456 | head -n 18

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Signed APK (v${{ steps.version.outputs.version_name }})
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Hoglabunia-Voter-App.apk
          cp ../Hoglabunia-Voter-App.apk "../Hoglabunia-Voter-App-v${{ steps.version.outputs.version_name }}.apk"
          cp ../Hoglabunia-Voter-App.apk ../Union-Voter-App.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hoglabunia-Voter-App-v${{ steps.version.outputs.version_name }}
          path: |
            Hoglabunia-Voter-App.apk
            Hoglabunia-Voter-App-v${{ steps.version.outputs.version_name }}.apk
            public/version.json
          retention-days: 90

      - name: Publish APK to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "হোগলাবুনিয়া ভোটার তালিকা APK v${{ steps.version.outputs.version_name }}"
          make_latest: true
          body: |
            ## 📱 হোগলাবুনিয়া ভোটার তালিকা - Android APK (v${{ steps.version.outputs.version_name }})
            - **অ্যাপের নাম:** হোগলাবুনিয়া ভোটার তালিকা (`com.voter.hoglabunia`)
            - **ডিজাইন:** Material Design 3 (Material You)
            - **ফায়ারবেস প্রজেক্ট:** `voter-ba30b`
            - **ভার্সন:** `v${{ steps.version.outputs.version_name }}` (Version Code: `${{ steps.version.outputs.version_code }}`)

            ### ⬇️ ডাউনলোড ও ইনস্টল করার নিয়ম:
            1. নিচে Assets থেকে **`Hoglabunia-Voter-App.apk`** ডাউনলোড করুন।
            2. মোবাইলে APK ফাইলটি ওপেন করে **Install** বাটনে চাপ দিন।
          files: |
            Hoglabunia-Voter-App.apk
            Hoglabunia-Voter-App-v${{ steps.version.outputs.version_name }}.apk
            Union-Voter-App.apk
            public/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
