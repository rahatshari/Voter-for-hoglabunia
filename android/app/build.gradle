plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def dynamicVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 100
def dynamicVersionName = project.hasProperty('versionName') ? project.property('versionName').toString() : "1.0.0"

android {
    namespace 'com.voterapp.union'
    compileSdk 34

    defaultConfig {
        applicationId "com.voterapp.union"
        minSdk 23
        targetSdk 34
        versionCode dynamicVersionCode
        versionName dynamicVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("voter-release-key.jks")
            storePassword "voter123456"
            keyAlias "voterkey"
            keyPassword "voter123456"
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Use the exact same signature and applicationId so updates install seamlessly without conflicts
            signingConfig signingConfigs.release
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
