    <script>
      (function() {
        try {
          var rawTheme = localStorage.getItem('voter_m3_theme_prefs_v1');
          if (rawTheme) {
            var prefs = JSON.parse(rawTheme);
            var root = document.documentElement;
            if (prefs.palette) root.setAttribute('data-theme', prefs.palette);
            var mode = prefs.mode === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : (prefs.mode || 'light');
            root.setAttribute('data-mode', mode);
            if (prefs.fontScale) root.setAttribute('data-font-scale', prefs.fontScale);
          }
        } catch (e) {}
        try {
          var p = window.location.pathname;
          var base = p.endsWith('.html') ? p.substring(0, p.lastIndexOf('/') + 1) : p.endsWith('/') ? p : p + '/';
          var link = document.querySelector('link[rel="manifest"]');
          if (link) {
            fetch(link.href)
              .then(function(res) { return res.json(); })
              .then(function(m) {
                m.start_url = base;
                m.scope = base;
                m.id = base;
                var blob = new Blob([JSON.stringify(m)], { type: 'application/manifest+json' });
                link.href = URL.createObjectURL(blob);
              })
              .catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
